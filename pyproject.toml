[project]
name = "livenix"
version = "0.1.0"
description = "Livenix face liveness SDK — Phase 1 research prototype"
authors = [{ name = "Livenix" }]
requires-python = ">=3.11"
license = { text = "Proprietary" }
readme = "README.md"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "timm>=1.0.7",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnx2tf>=1.22.0",
    "tensorflow>=2.16.0",
    "tf-keras>=2.16.0",
    "onnx-graphsurgeon>=0.5.0",
    "sng4onnx>=1.0.0",
    "keras>=3.0.0",
    "ai-edge-litert>=1.0.0; platform_system != 'Windows'",
    "coremltools>=8.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0,<2.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "albumentations>=1.4.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "ipython>=8.0.0",
]
train = [
    "pytorch-lightning>=2.3.0",
    "tensorboard>=2.16.0",
    "transformers>=4.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livenix"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
